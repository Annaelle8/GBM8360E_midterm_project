# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Fast imaging for an GRE sequence
  authors:
    - name: Annaelle Sarrazin   # TODO: your full name
      affiliations:
        - Polytechnique Montréal
  copyright: '2026'
  license: CC-BY-4.0
  open_access: true
  date: 2026-09-29
  keywords:
    - MRI
    - accelerated imaging
    - gradient echo
    - parallel imaging

  numbering:
    headings: true

  # Hover any of these in the rendered text to see the expansion.
  abbreviations:
    MRI: Magnetic resonance imaging
    GRE: Gradient-recalled echo
    EPI: Echo-planar imaging
    SENSE: Sensitivity encoding
    GRAPPA: Generalized autocalibrating partially parallel acquisitions
    ACS: Auto-calibration signal
    TR: Repetition time
    TE: Echo time
    FOV: Field of view
    PE: Phase encode
    RO: Readout
    RF: Radio-frequency
    FFT: Fast Fourier transform
    IFFT: Inverse Fast Fourier transform
    RSS: Root sum of squares
    SNR: Signal-to-noise ratio

  bibliography:
    - bibliography/references.bib

  exclude:
    - README.md

  exports:
    # A BOOK template (not the default article one), so every chapter is printed.
    - format: typst
      template: plain_typst_book
      output: exports/k-space-painters.pdf
      articles:
        - file: index.md
        - file: 01-Physics_background.md
        - file: 02-gre.md
        - file: 03-epi.md
        - file: 04-undersampling.md
        - file: 05-sense.md
        - file: 06-grappa.md
        - file: 08-epilogue.md

  toc:
    - file: index.md
    - file: 01-Physics_background.md
    - file: 02-gre.md
    - file: 03-epi.md
    - file: 04-undersampling.md
    - file: 05-sense.md
    - file: 06-grappa.md
    - file: 08-epilogue.md
    # The notebook that computes every figure. It must be in the toc for MyST to
    # build it, otherwise `:::{figure} #label` has nothing to embed. `hidden: true`
    # keeps it out of the sidebar.
    - file: notebooks/gre-artefacts.ipynb
      hidden: true
    - file: notebooks/figures.ipynb
      hidden: true

site:
  template: book-theme
  actions:
    - title: Source on GitHub
      url: https://github.com/GBM8360/lab2-Annaelle8
